name: CI

on:
  push:
    branches: [main, master, codex/resume-readiness]
  pull_request:
    branches: [main, master, codex/resume-readiness]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test scripts/test-sse.mjs
      - run: npm run build
      - run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps chromium
      - name: Browser fixture smoke
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/frontend.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-browser-evidence
          path: frontend/screenshots/
